# Fly.io deployment config
# Deploy with: fly launch (first time) or fly deploy (subsequent)

app = "ai-dungeon-master"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_PORT = "8000"
  LLM_PROVIDER = "ollama"
  IMAGE_PROVIDER = "procedural"
  TTS_PROVIDER = "disabled"
  VECTOR_BACKEND = "numpy"
  DEBUG = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 500

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[mounts]
  source = "dungeon_data"
  destination = "/app/backend/saves"
