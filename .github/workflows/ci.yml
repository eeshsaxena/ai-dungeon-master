name: CI — AI Dungeon Master

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check backend/ --ignore E501

      - name: Type check with mypy (optional)
        run: |
          pip install mypy
          mypy backend/ --ignore-missing-imports --no-strict-optional || true

      - name: Run backend tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest backend/tests/ -v

      - name: Validate FastAPI routes load
        run: |
          cd backend
          python -c "from main import app; print('FastAPI app loaded successfully')"

  # ── Frontend Checks ──────────────────────────────────────────────────────
  frontend:
    name: Frontend (JS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          pip install html5lib
          python -c "
          import html5lib
          with open('frontend/index.html') as f:
              html5lib.parse(f.read())
          print('HTML validation passed')
          "

      - name: Check JS syntax
        run: |
          node --check frontend/game.js
          node --check frontend/narrator.js
          node --check frontend/combat.js
          node --check frontend/emotion.js
          node --check frontend/knowledge_graph.js
          echo 'All JS files syntax OK'

  # ── Docker Build ─────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ai-dungeon-master:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Data Validation ──────────────────────────────────────────────────────
  data:
    name: World Data Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python -c "
          import json, sys
          files = [
              'backend/data/world_lore.json',
              'backend/data/quests.json'
          ]
          for f in files:
              with open(f) as fp:
                  json.load(fp)
              print(f'OK: {f}')
          print('All data files valid!')
          "
